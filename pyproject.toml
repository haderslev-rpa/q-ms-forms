[project]
name = "q-ms-forms"
version = "0.1.0"
description = "Genbrugeligt Playwright-object til Microsoft Forms og tilknyttede Excel-svar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "openpyxl>=3.1.5",
    "playwright>=1.59.0",
    "python-dotenv>=1.2.4",
    "q-haderslev-vbo",
    "requests>=2.31.0",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }
q-haderslev-vbo = { git = "https://github.com/haderslev-rpa/q-haderslev-vbo.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_ms_forms"]